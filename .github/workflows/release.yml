name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build & Release macOS Bundle
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri macOS application
        run: npx tauri build

      - name: Build PKG Installer
        run: |
          mkdir -p release-artifacts
          cp src-tauri/target/release/bundle/dmg/*.dmg release-artifacts/
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild --component "src-tauri/target/release/bundle/macos/Limen.app" \
                   --install-location "/Applications" \
                   --version "${VERSION}" \
                   "release-artifacts/Limen_${VERSION}_aarch64.pkg"

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          shasum -a 256 *.dmg *.pkg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            release-artifacts/*.dmg
            release-artifacts/*.pkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.pkg
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
