[package]
name = "limen"
version = "0.1.0"
description = "Native macOS menu bar AWS credential switcher"
authors = ["Ranajoy Dutta"]
edition = "2021"

[lib]
name = "limen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
window-vibrancy = "0.6"

# AWS SSO-OIDC
aws-config = "1.5"
aws-sdk-ssooidc = "1.5"
aws-sdk-sso = "1.5"

# Security & Storage
sha2 = "0.10"

# Async & Serialization
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
url = "2.5"
open = "5.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
# clippy linting rules
